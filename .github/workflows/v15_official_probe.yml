name: V15 official-source network proof
on:
  push:
    branches: [v15-evidence-recovery]
    paths: [.github/workflows/v15_official_probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch and hash government-origin originals
        shell: bash
        run: |
          mkdir -p v15_cloud
          python - <<'PYCODE'
          from pathlib import Path
          import json,hashlib,datetime,urllib.request
          root=Path('v15_cloud')
          targets={'TIGER2024_WI_PLACE':'https://www2.census.gov/geo/tiger/TIGER2024/PLACE/tl_2024_55_place.zip','ACS2024_5YR_B01002':'https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/acsdt5y2024-b01002.dat'}
          receipts=[]
          for name,url in targets.items():
            r={'name':name,'official_url':url,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Academic-Research-V15/1.0'})
              with urllib.request.urlopen(req,timeout=120) as f:
                data=f.read();r['http_code']=f.status
              if len(data)<200 or b'<html' in data[:128].lower():raise ValueError('not original data')
              ext='.zip' if 'TIGER' in name else '.dat'
              (root/(name+ext)).write_bytes(data)
              r.update(status='ORIGINAL_DOWNLOADED',sha256=hashlib.sha256(data).hexdigest(),bytes=len(data))
            except Exception as e:r.update(status='FAILED',exception=repr(e))
            receipts.append(r);print(r)
          (root/'receipts.json').write_text(json.dumps(receipts,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-official-evidence-probe
          path: v15_cloud/
          retention-days: 10
